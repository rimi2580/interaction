<!DOCTYPE html>
<html lang="en">
<!--태스트-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vancouver Archive | BIG Naughty</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="header-left">
            <h1>YVR</h1>
        </div>

        <nav class="header-nav">
            <span>Check-in</span>
            <span>Journey</span>
            <span>Archive</span>
        </nav>

        <div class="header-right">
            <span>BOARDING ↗</span>
        </div>
    </header>
    <main>
        <section class="departures">
            <div class="departures-title">
                <img src="images/airplane.png" alt="비행기 아이콘">
                <h2>Departures</h2>
            </div>
            <div class="flight-labels">
                <span class="flight-time">Time</span>
                <span class="flight-destination">Destination</span>
                <span class="flight-status">Status</span>
            </div>

            <!-- 전광판 목록 -->
            <div class="flight-list">
                <img src="images/flight-list.png" alt="밴쿠버 출발 전광판">
            </div>
        </section>
        <!-- 탑승권 섹션 -->
        <section class="boarding">

            <div class="boarding-title">
                <p>READY TO BOARD?</p>
                <h2>VANCOUVER</h2>
            </div>
            <!-- 탑승권 이미지 -->
            <div class="ticket-image">
                <img src="images/boarding-ticket.png" alt="밴쿠버행 탑승권">
            </div>

        </section>

    </main>

</body>

</html>
